<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Flinder helps you find compatible flatmates with smooth swipe-based matching.">
  <meta name="theme-color" content="#121212">
  <meta name="color-scheme" content="dark">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Flinder">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Flinder</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      background: #121212;
      margin: 0;
      min-height: 100%;
    }

    body {
      overflow: hidden;
    }

    .flinder-web-splash {
      align-items: center;
      background: #121212;
      display: flex;
      inset: 0;
      justify-content: center;
      position: fixed;
      z-index: 9999;
    }

    .flinder-web-splash img {
      border-radius: 24px;
      height: 108px;
      width: 108px;
    }
  </style>
</head>
<body>
  <div class="flinder-web-splash">
    <img src="icons/Icon-192.png" alt="Flinder">
  </div>
  <script>
    window.addEventListener('wheel', function (event) {
      if (event.ctrlKey) {
        event.stopImmediatePropagation();
      }
    }, { capture: true, passive: true });

    window.addEventListener('flutter-first-frame', function () {
      var splash = document.querySelector('.flinder-web-splash');
      if (splash) {
        splash.remove();
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
